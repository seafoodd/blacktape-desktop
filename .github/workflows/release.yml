name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # audiopus_sys bundles an old Opus CMakeLists that newer CMake rejects
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  publish-tauri:
    name: Build & Publish Tauri App
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

          # .deb, .rpm and .AppImage; built on the oldest supported Ubuntu so they also run on older distributions
          - platform: "ubuntu-22.04"
            args: ""

          # Uncomment below when you are ready to produce macOS builds:
          # - platform: "macos-latest"
          #   args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Release with Tauri Action
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for Tauri auto-updater:
          # Generated with: npx @tauri-apps/cli signer generate
          # Add these to GitHub Repo Settings -> Secrets and variables -> Actions
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "Release notes are added when the build finishes."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Auto-updater configuration:
          # Generates and attaches latest.json with signatures (.sig) to the GitHub release
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      # A single exe and nothing else: download anywhere and run, no installer.
      - name: Add the portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $exe = "Blacktape_${version}_x64_portable.exe"
          Copy-Item src-tauri/target/release/blacktape-desktop.exe $exe
          gh release upload "v$version" $exe --clobber

  finalize:
    name: Release notes
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # "What's Changed" and "Full Changelog" (compare with the previous release), as GitHub generates them.
      # The in-app update dialog reads its notes from latest.json, not from the release page, so they go there too.
      # The updater signatures cover the installers only, so changing latest.json does not break them.
      - name: Write the release notes
        run: |
          tag="v$(jq -r .version package.json)"
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" --jq .body > notes.md
          gh release edit "$tag" --notes-file notes.md
          gh release download "$tag" --pattern latest.json --dir updater
          jq --rawfile notes notes.md '.notes = $notes' updater/latest.json > latest.json
          gh release upload "$tag" latest.json --clobber
