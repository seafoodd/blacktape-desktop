name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # audiopus_sys bundles an old Opus CMakeLists that newer CMake rejects
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  publish-tauri:
    name: Build & Publish Tauri App
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (Current primary target)
          - platform: "windows-latest"
            args: ""

          # Uncomment below when you are ready to produce macOS & Linux builds:
          # - platform: "macos-latest"
          #   args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin"
          # - platform: "ubuntu-22.04"
          #   args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for Tauri auto-updater:
          # Generated with: npx @tauri-apps/cli signer generate
          # Add these to GitHub Repo Settings -> Secrets and variables -> Actions
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Blacktape v__VERSION__"
          releaseBody: "See the assets below to download and install Blacktape v__VERSION__."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Auto-updater configuration:
          # Generates and attaches latest.json with signatures (.sig) to the GitHub release
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
