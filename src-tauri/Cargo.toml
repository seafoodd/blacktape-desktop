[package]
name = "blacktape-desktop"
version = "0.7.0"
description = "A desktop music player that can download and organize music from different platforms."
authors = ["seafood"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blacktape_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustypipe = "0.11.4"
tauri = { version = "2", features = ["protocol-asset", "test", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2.3.0"
rodio = { version = "0.22.2", default-features = true, features = ["symphonia-all"] }
lofty = "0.24.0"
tauri-plugin-dialog = "2.6.0"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
discord-rich-presence = "1.1.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "stream", "gzip"] }
tokio = "1.51.1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "json", "macros"] }
sha2 = "0.10"
regex = "1.12.3"
rayon = "1.12.0"
jwalk = "0.8.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
strsim = "0.11.1"
unicode-normalization = "0.1"
html-escape = "0.2.13"
url = "2.5.8"
percent-encoding = "2.3.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ogg = "0.9.2"
opus = "0.3.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.9"
tauri-plugin-sentry = "0.9.0"
sentry = { version = "0.49", features = ["tracing"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "scan_benchmark"
harness = false

[profile.dev]
lto = false
codegen-units = 16
opt-level = 0      # fastest compile
debug = 2          # keep debug info if needed
incremental = true # default, keeps previous build artifacts

# Image decoding/resizing is unusably slow at opt-level 0 (cover thumbnails took seconds each),
# so optimize just the image stack even in dev builds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.pxfm]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.bytemuck]
opt-level = 3
[profile.dev.package.byteorder-lite]
opt-level = 3

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true      # Ensures debug symbols are removed.
panic = "abort"   # Higher performance by disabling panic handlers.

[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 2
strip = false

[profile.bench]
opt-level = 2        # Level 2 compiles much faster than 3 with almost zero runtime difference
codegen-units = 16   # Compiles crates in parallel across your CPU cores
lto = false          # Disables LTO to cut link time by 50%+
debug = false        # Skips generating debug symbols
incremental = true   # Cache unchanged crates between bench runs
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-single-instance = "2"
